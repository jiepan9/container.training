apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: staging
spec:
  parentRefs:
  - name: web        # Gateway name
    namespace: traefik           # Gateway namespace
  hostnames:
  - staging.wichita-ks.xyz
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: app
      port: 80