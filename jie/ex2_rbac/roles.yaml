  name: namespace-admin
subjects:
- kind: User
  name: bob
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: alice-reader
  namespace: alice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-reader
subjects:
- kind: User
  name: bob
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: bob-reader
  namespace: bob
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-reader
subjects:
- kind: User
  name: alice