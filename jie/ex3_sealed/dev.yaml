apiVersion: v1
kind: Namespace
metadata:
  labels:
    kubernetes.io/metadata.name: dev
  name: dev
spec:
  finalizers:
  - kubernetes
status:
  phase: Active
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: database-password
  namespace: dev
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: database-password
      namespace: dev

---

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: logging-api-token
  namespace: dev
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: logging-api-token
      namespace: dev

---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app
  name: app
  namespace: dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: logging-api-token
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: database-password
        image: jpetazzo/color
        imagePullPolicy: Always
        name: color
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
