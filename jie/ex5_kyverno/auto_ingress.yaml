apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auto-ingress
spec:
  rules:
  - name: create-ingress
    match:
      any:
      - resources:
          kinds:
          - Service
          selector:
            matchLabels:
              autoingr: "true"
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - traefik
    preconditions:
      all:
      - key: "{{request.object.spec.type}}"
        operator: Equals
        value: ClusterIP
      - key: "{{request.object.spec.ports[0].port}}"
        operator: AnyIn
        value: [80, 443]
    generate:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: "{{request.object.metadata.name}}"
      namespace: "{{ request.object.metadata.namespace}}"
      synchronize: true
      data:
        spec:
          ingressClassName: traefik
          rules:
          - host: "{{ request.object.metadata.name }}.{{ request.object.metadata.namespace }}.wichita-ks.xyz"
            http:
              paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: "{{ request.object.metadata.name }}"
                    port:
                      number: "{{ request.object.spec.ports[0].port }}"