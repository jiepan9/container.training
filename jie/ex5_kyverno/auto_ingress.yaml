apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auto-ingress
spec:
  rules:
  - name: create-ingress
    match:
      any:
      - resources:
          kinds:
          - Service
          selector:
            matchLabels:
              autoingr: "true"
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - traefik
    preconditions:
      all:
      - key: "{{request.object.spec.type}}"
        operator: Equals
        value: ClusterIP
      - key: "{{request.object.spec.ports[0].port}}"
        operator: AnyIn
        value: [80, 443]
    generate:
      synchronize: true
      foreach:
      - list: "request.object.spec.ports[:1]"
        apiVersion: networking.k8s.io/v1
        kind: Ingress
        name: "{{request.object.metadata.name}}"
        namespace: "{{ request.object.metadata.namespace}}"
        data:
          spec:
            ingressClassName: traefik
            rules:
            - host: "{{ request.object.metadata.labels.app }}.{{ request.object.metadata.namespace }}.{{ request.object.metadata.labels.domain || 'wichita-ks.xyz' }}"
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ request.object.metadata.name }}"
                      port:
                        number: "{{ request.object.spec.ports[0].port }}"
      - list: "request.object.spec.ports[:1]"
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: "{{ request.object.metadata.name }}"
        namespace: "{{ request.object.metadata.namespace}}"
        data:
          spec:
            parentRefs:
            - name: web
              namespace: traefik
            hostnames:
            - "{{ request.object.metadata.namespace }}.{{ request.object.metadata.labels.domain || 'wichita-ks.xyz' }}"
            rules:
            - backendRefs:
              - name: "{{ request.object.metadata.name }}"
                port: "{{ request.object.spec.ports[0].port }}"
              matches:
                - path:
                    type: PathPrefix
                    value: "/{{ request.object.metadata.name }}"
  - name: create-tlsroute
    match:
      any:
      - resources:
          kinds:
          - Service
          selector:
            matchLabels:
              autotls: "true"
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kyverno
          - traefik
    preconditions:
      all:
      - key: "{{request.object.spec.type}}"
        operator: Equals
        value: ClusterIP
    generate:
      apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      name: "{{ request.object.metadata.name }}"
      namespace: "{{ request.object.metadata.namespace}}"
      synchronize: true
      data:
        spec:
          parentRefs:
          - name: web
            namespace: traefik
            sectionName: tls-passthrough
          hostnames:
          - "{{ request.object.metadata.name }}.{{ request.object.metadata.namespace }}.{{ request.object.metadata.labels.domain || 'wichita-ks.xyz' }}"
          rules:
          - backendRefs:
            - name: "{{ request.object.metadata.name }}"
              port: "{{ request.object.spec.ports[0].port }}"
